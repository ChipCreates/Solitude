name: solitude
description: A beautiful, open-source solitaire card game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  xml: ^6.5.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  collection: ^1.18.0
  audioplayers: ^6.1.0
  window_manager: ^0.4.3
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Optional: if you later add TypeAdapters
  # hive_generator: ^1.1.4
  # build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/cards/
    - assets/fonts/
    - assets/audio/
    - assets/data/
    - assets/icon.jpg
    - assets/splash-bg.svg
    - assets/solitude-bg.webp
    - assets/solitude-logo.svg
    - assets/solitude-bg.svg
    - assets/solitude-logo.svg
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
