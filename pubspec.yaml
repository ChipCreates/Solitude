name: solitude
description: A beautiful, open-source solitaire card game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  xml: ^6.5.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  collection: ^1.18.0
  audioplayers: ^6.1.0
  window_manager: ^0.4.3
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  # Optional: if you later add TypeAdapters
  # hive_generator: ^1.1.4
  # build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/cards/
    - assets/fonts/
    - assets/audio/
    - assets/data/
    - assets/icon.jpg
    - assets/splash-bg.svg
    - assets/solitude-bg.webp
    - assets/solitude-logo.svg
    - assets/solitude-bg.svg
    - assets/solitude-logo.svg
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  linux: "icon"
  image_path: "assets_setup/icon.png" 
  min_sdk_android: 21 # Recommended for modern support
  
  # Adaptive Icons (Android 8.0+) - Highly Recommended
  # This prevents your icon from looking tiny inside a white circle
  adaptive_icon_background: "#2d3130" # Your app's dark background color hex
  adaptive_icon_foreground: "assets_setup/icon.png" # Or a specific foreground-only version

flutter_native_splash:
  # This color should match your AppTheme background to prevent a "flash"
  color: "#2d3130" 
  image: "assets_setup/splash.png"
  branding: "assets_setup/splash.png" # Optional: Keeps logo center/bottom
  
  # Dark Mode Support (Optional but recommended for Solitude)
  color_dark: "#000000"
  image_dark: "assets_setup/splash.png"

  android_12:
    # Android 12+ handles splash screens differently (icon popping out)
    image: "assets_setup/splash.png"
    icon_background_color: "#2d3130"